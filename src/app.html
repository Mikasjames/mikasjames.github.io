<!doctype html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/svg+xml" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="google-site-verification" content="dhPJFYfvegnXee_PvJ5uMuMlXewmCV9G_YF4M-NuEh8" />
  <meta name="description"
    content="Mikas James Gamboa Arayata — Full-Stack Software Engineer specializing in Web/PWA solutions, AI integration, and software reliability." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mikas James" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    /* Critical loader styles: inlined so the intro paints before the app CSS/JS. */
    html.app-loading body {
      overflow: hidden;
    }

    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #09090b;
      animation: appLoaderOut 400ms ease 900ms forwards;
    }

    .app-loader__stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 8rem;
      height: 8rem;
    }

    .app-loader svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: #c084fc;
    }

    .app-loader .draw-container {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawContainerEffect 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      will-change: stroke-dashoffset;
    }

    .app-loader .draw-bracket {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawBracketEffect 0.55s ease-in-out 0.2s forwards;
      will-change: stroke-dashoffset;
    }

    .app-loader .blink-cursor {
      opacity: 0;
      animation: blinkEffect 0.8s infinite steps(2, start) 0.75s;
    }

    @keyframes appLoaderOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes drawContainerEffect {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes drawBracketEffect {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes blinkEffect {
      0%,
      49% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }
  </style>
  <script>
    // Lock scrolling for the duration of the home intro without waiting for hydration.
    if (location.pathname === '/') {
      document.documentElement.classList.add('app-loading');
      setTimeout(function () {
        document.documentElement.classList.remove('app-loading');
      }, 1300);
    }
  </script>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-[#09090b] text-zinc-50 antialiased">
  <div>%sveltekit.body%</div>
</body>

</html>
